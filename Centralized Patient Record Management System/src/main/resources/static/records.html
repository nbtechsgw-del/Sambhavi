<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records | CPRMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <a href="/" class="brand-mark">CPRMS</a>
            <nav class="site-nav">
                <a href="/" class="nav-link">Home</a>
                <a href="/patients.html" class="nav-link">Patients</a>
                <a href="/records.html" class="nav-link active">Records</a>
                <a href="/appointments.html" class="nav-link">Appointments</a>
                <a href="/billing.html" class="nav-link">Billing</a>
                <a href="/reports.html" class="nav-link">Reports</a>
            </nav>
        </header>

        <section class="page-intro">
            <section class="auth-panel card compact-auth">
                <div class="card-head">
                    <h2>Session</h2>
                    <p>Reconnect or switch staff account.</p>
                </div>
                <form id="login-form" class="stack">
                    <label><span>Username</span><input id="username" name="username" type="text" value="admin" required></label>
                    <label><span>Password</span><input id="password" name="password" type="password" value="admin123" required></label>
                    <button type="submit" class="primary-btn">Connect</button>
                </form>
                <p id="auth-status" class="status-line">Connect the dashboard to load this page.</p>
                <div class="chips">
                    <button type="button" class="chip" data-user="admin" data-pass="admin123">Admin</button>
                    <button type="button" class="chip" data-user="doctor" data-pass="doctor123">Doctor</button>
                    <button type="button" class="chip" data-user="nurse" data-pass="nurse123">Nurse</button>
                </div>
            </section>
        </section>

        <main class="dashboard-grid">
            <section class="card span-2">
                <div class="card-head">
                    <h2>Record Entry</h2>
                    <p>Store diagnoses, treatments, allergies, prescriptions, and lab documents.</p>
                </div>
                <form id="record-form" class="form-grid">
                    <label><span>Patient ID</span><input name="patientId" type="number" required></label>
                    <label><span>Doctor Name</span><input name="doctorName" required></label>
                    <label><span>Diagnosis</span><input name="diagnosis" required></label>
                    <label><span>Treatment</span><input name="treatment"></label>
                    <label><span>Allergies</span><input name="allergies"></label>
                    <label><span>Prescription</span><input name="prescription"></label>
                    <label class="full-width"><span>Lab Report URL</span><input name="labReportUrl"></label>
                    <div class="form-actions">
                        <button type="submit" class="primary-btn">Save Record</button>
                        <button type="button" id="load-records" class="secondary-btn">Load Patient Records</button>
                    </div>
                </form>
                <p id="record-form-status" class="status-line"></p>
            </section>

            <section class="card span-2">
                <div class="card-head">
                    <h2>Record History</h2>
                    <p>Loaded records for the selected patient.</p>
                </div>
                <div id="record-list" class="result-list"></div>
            </section>
        </main>
    </div>

    <script type="module" src="/records.js"></script>
</body>
</html>
