spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/patientrecords?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:Root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

app:
  security:
    users:
      - username: admin
        password: admin123
        role: ADMIN
      - username: doctor
        password: doctor123
        role: DOCTOR
      - username: nurse
        password: nurse123
        role: NURSE
      - username: reception
        password: reception123
        role: RECEPTIONIST
