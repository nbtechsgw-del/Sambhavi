<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<form class="auth-card wide" th:action="@{/register}" th:object="${user}" method="post" onsubmit="return validateRegister()">
    <h1>Create Account</h1>
    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <div class="two-col">
        <div>
            <label>Name</label>
            <input id="name" th:field="*{name}" required>
        </div>
        <div>
            <label>Email</label>
            <input id="email" th:field="*{email}" type="email" required>
        </div>
        <div>
            <label>Password</label>
            <input id="password" th:field="*{password}" type="password" required>
        </div>
        <div>
            <label>Phone</label>
            <input th:field="*{phone}" required>
        </div>
        <div>
            <label>Account Type</label>
            <select id="role" th:field="*{role}" onchange="togglePersonalCode()">
                <option value="USER">Customer</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <div id="personalCodeGroup" class="hidden">
            <label>Personal Code</label>
            <input id="personalCode" th:field="*{personalCode}" type="password" placeholder="Required for admin">
        </div>
    </div>
    <label>Address</label>
    <textarea th:field="*{address}" required></textarea>
    <button class="btn full" type="submit">Register</button>
    <p><a th:href="@{/customer/login}">Already registered?</a></p>
</form>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
