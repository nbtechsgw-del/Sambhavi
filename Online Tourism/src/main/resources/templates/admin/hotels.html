<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Hotels</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar"><a class="brand" th:href="@{/admin}">Admin Panel</a><div><a th:href="@{/admin/packages}">Packages</a><a th:href="@{/logout}">Logout</a></div></nav>
<main class="container split">
    <form class="panel" th:action="@{/admin/hotels}" th:object="${hotel}" method="post">
        <h2>Add/Edit Hotel</h2>
        <input type="hidden" th:field="*{id}">
        <label>Name</label><input th:field="*{name}" required>
        <label>City</label><input th:field="*{city}" required>
        <input type="hidden" th:field="*{roomsAvailable}">
        <input type="hidden" th:field="*{pricePerNight}">
        <input type="hidden" th:field="*{roomType}">
        <label>Room Types, Rooms and Prices</label>
        <div class="room-type-editor" id="roomTypeEditor">
            <div class="room-type-row" th:each="roomTypeItem : *{roomTypes}">
                <input name="roomTypeNames" th:value="${roomTypeItem.typeName}" placeholder="Room type" required>
                <input name="roomTypeRooms" th:value="${roomTypeItem.roomsAvailable}" type="number" min="0" placeholder="Rooms" required>
                <input name="roomTypePrices" th:value="${roomTypeItem.pricePerNight}" type="number" step="0.01" min="0" placeholder="Price/night" required>
                <button class="btn small danger" type="button" onclick="removeRoomTypeRow(this)">Remove</button>
            </div>
            <div class="room-type-row" th:if="*{roomTypes == null || roomTypes.isEmpty()}">
                <input name="roomTypeNames" th:value="*{roomType}" placeholder="Room type" required>
                <input name="roomTypeRooms" th:value="*{roomsAvailable}" type="number" min="0" placeholder="Rooms" required>
                <input name="roomTypePrices" th:value="*{pricePerNight}" type="number" step="0.01" min="0" placeholder="Price/night" required>
                <button class="btn small danger" type="button" onclick="removeRoomTypeRow(this)">Remove</button>
            </div>
        </div>
        <button class="btn small" type="button" onclick="addRoomTypeRow()">Add Room Type</button>
        <label>Rating</label><input th:field="*{rating}" type="number" step="0.1" min="1" max="5" required>
        <label>Description</label><textarea th:field="*{description}"></textarea>
        <button class="btn full">Save Hotel</button>
    </form>
    <section class="panel">
        <h2>Hotels</h2>
        <div class="alert" th:if="${error}" th:text="${error}"></div>
        <table>
            <tr><th>Name</th><th>City</th><th>Types</th><th>Rooms</th><th>From Price</th><th>Action</th></tr>
            <tr th:each="hotelItem : ${hotels}">
                <td th:text="${hotelItem.name}"></td>
                <td th:text="${hotelItem.city}"></td>
                <td th:text="${hotelItem.roomTypeSummary}"></td>
                <td th:text="${hotelItem.totalRoomsAvailable}"></td>
                <td th:text="'Rs. ' + ${hotelItem.startingPrice}"></td>
                <td>
                    <div class="admin-actions">
                        <a class="btn small" th:href="@{/admin/hotels/edit/{id}(id=${hotelItem.id})}">Edit</a>
                        <form th:action="@{/admin/hotels/delete/{id}(id=${hotelItem.id})}" method="post">
                            <button class="btn small danger" type="submit">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
        </table>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
