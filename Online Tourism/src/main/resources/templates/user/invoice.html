<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
    <a class="brand" th:href="@{/user/dashboard}">TourEase</a>
    <div><a th:href="@{/user/dashboard}">Dashboard</a><a href="#" onclick="window.print()">Print Invoice</a></div>
</nav>
<main class="container">
    <section class="panel invoice">
        <div class="panel-heading">
            <div>
                <p class="eyebrow">Tax invoice</p>
                <h1>Invoice #<span th:text="${booking.id}">0</span></h1>
            </div>
            <span class="badge" th:text="${payment != null ? payment.status : 'UNPAID'}">Status</span>
        </div>
        <div class="two-col">
            <div>
                <h3>Billed To</h3>
                <p th:text="${booking.user.name}">Customer</p>
                <p th:text="${booking.user.email}">Email</p>
                <p th:text="${booking.user.phone}">Phone</p>
            </div>
            <div>
                <h3>Trip Details</h3>
                <p th:text="${booking.tourPackage.title}">Package</p>
                <p th:text="${booking.travelDate}">Date</p>
                <p th:text="${booking.travellers} + ' travellers'">Travellers</p>
            </div>
        </div>
        <table>
            <tr><th>Description</th><th>Amount</th></tr>
            <tr>
                <td th:text="${booking.tourPackage.title} + ' package booking'">Package booking</td>
                <td th:text="'₹' + ${booking.totalAmount}">₹0</td>
            </tr>
            <tr>
                <th>Total</th>
                <th th:text="'₹' + ${booking.totalAmount}">₹0</th>
            </tr>
        </table>
        <p class="muted" th:if="${payment != null}" th:text="'Transaction: ' + ${payment.transactionId}">Transaction</p>
        <p class="muted" th:if="${payment == null}">Payment is not completed yet.</p>
    </section>
</main>
</body>
</html>
